[tool.poetry]
name = "task-tracker"
version = "0.1.0"
description = "Task tracker project"
authors = ["Ilya Kourdakov <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
django = "5.2.5"
psycopg2 = "2.9.10"
python-dotenv = "1.1.1"
djangorestframework = "3.16.1"
django-filter = "25.1"
djangorestframework-simplejwt = "5.5.1"
drf-spectacular = "0.28.0"
gunicorn = "23.0.0"

[tool.poetry.group.exec.dependencies]
ipython = "9.5.0"

[tool.poetry.group.dev.dependencies]
coverage = "7.10.6"
black = "25.1.0"
flake8 = "7.3.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = '.git'